required_clinical_decisions:
  - 滑膜表示正常可见滑膜，还是符合定义的滑膜增厚或增生
  - 滑膜血流是否只标滑膜内Power或Color Doppler信号，并记录成像模式和阈值
  - 结晶应拆为双轨征、聚集体或其他钙化，不使用泛化结晶名称直接训练
  - 软骨表示正常解剖结构还是软骨损伤区域
  - 骨皮质表示可见骨皮质定位，不与骨侵蚀或骨赘混合
  - 囊肿、滑膜囊肿、半月板囊肿、腘窝囊肿和滑囊炎是否合并为上层类别及保留哪些子类
  - 鹅足腱滑囊与鹅足腱滑囊炎是否分别表示解剖结构和病变
  - 每张图对哪些目标完成穷尽标注，哪些只是阳性发现记录
