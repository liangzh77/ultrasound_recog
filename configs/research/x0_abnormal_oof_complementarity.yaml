study_code: X0
status: preregistered_results_unknown
seed: 20260724
data_fingerprint: 62ecb01c4d77ec0012704611ecc8d18ef51ebb4e0ea744fb3896948829f0b675
research_question: >-
  Among patients whose reference standard is already abnormal, do existing
  strictly out-of-fold ROI image probabilities add complementary information
  to the frozen C3 clinical numeric baseline for five-class differential diagnosis?
classes: [ra, ga, spa, oa, injury]
inputs:
  image_oof:
    model_id: E2
    path: workspace/experiments/active/exp_2026-07_patient_multimodal_v1/reports/oof/E2_oof.csv
    sha256: 169472d914290f19e01c3fa591193704d8b6bbc732eafe69056d4d2f9bb17949
    probability_columns: [prob_ra, prob_ga, prob_spa, prob_oa, prob_injury]
    excluded_probability_column: prob_normal
  clinical_oof:
    model_id: C3
    path: workspace/experiments/active/exp_2026-07_patient_multimodal_v1/reports/clinical/oof/C3_oof.csv
    sha256: 9bcdedef62b6179a8de0b5118d13a367184cbdc0f0b75a7f23d1bd4a14eb5d8c
    probability_columns: [prob_ra, prob_ga, prob_spa, prob_oa, prob_injury]
cohort_contract:
  expected_patients: 767
  expected_outer_folds: [0, 1, 2, 3, 4]
  require_exact_person_fold_reference_match: true
  exclude_reference_class: normal
  allow_duplicate_person_keys: false
probability_contract:
  tolerance: 1.0e-6
  conditional_image_normalization: renormalize_five_abnormal_probabilities
  minimum_denominator: 1.0e-12
primary_fixed_fusion:
  method: arithmetic_probability_blend
  clinical_weight: 0.75
  image_weight: 0.25
  search_weights: false
evaluation:
  primary_metric: macro_f1
  secondary_metrics: [macro_auc, accuracy, ece, multiclass_brier]
  bootstrap_samples: 2000
  bootstrap_seed: 20260724
  confidence_level: 0.95
  report_per_class: true
  report_per_fold: true
  report_error_complementarity: true
d0_feasibility_gate:
  decision_rule: primary_blend_passes_or_error_rescue_passes
  primary_blend:
    minimum_macro_f1_delta_vs_c3: 0.01
    require_paired_ci_lower_above_zero: true
    minimum_positive_folds: 4
    maximum_per_class_f1_drop: 0.05
  error_rescue:
    minimum_c3_error_rescue_fraction_by_e2: 0.15
    minimum_folds_with_at_least_one_rescue: 4
    minimum_classes_with_at_least_one_rescue: 3
interpretation_contract:
  exploratory_only: true
  cannot_advance_g0: true
  cannot_claim_complete_six_class_model: true
  cannot_unlock_2026_inference: true
  no_new_model_is_trained: true
runtime:
  max_cpu_threads: 2
  target_minutes: 15
  hard_limit_minutes: 60
  use_gpu: false
outputs:
  result_json: workspace/experiments/active/exp_2026-07_patient_multimodal_v1/reports/fusion/X0_oof_complementarity.json
  patient_oof_csv: workspace/experiments/active/exp_2026-07_patient_multimodal_v1/reports/fusion/X0_oof_complementarity.csv
  mlflow_experiment: knee_patient_multimodal_research
